<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eksoda</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23eef1ef%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2232%22%20fill%3D%22none%22%20stroke%3D%22%235d89ab%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20stroke-dasharray%3D%22114.07%20239%22%20transform%3D%22rotate%28-86%2050%2050%29%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2232%22%20fill%3D%22none%22%20stroke%3D%22%23d69c5c%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20stroke-dasharray%3D%2266.32%20239%22%20transform%3D%22rotate%2894%2050%2050%29%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2232%22%20fill%3D%22none%22%20stroke%3D%22%236aa884%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20stroke-dasharray%3D%2242.44%20239%22%20transform%3D%22rotate%28202%2050%2050%29%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2250%22%20dy%3D%22.36em%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%20Black%2CArial%2Csans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2240%22%20fill%3D%22%232b3430%22%3Ee%3C/text%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@300;400;600;700&display=swap">
<style>
/* eksoda — new look: green hero on top, light sheet below, bottom tab bar with labels */
:root{
  --bg:#eef1ef; --surface:#ffffff; --soft:#f1f4f2; --fg:#2b3430; --muted:#76817b; --line:#e2e7e4;
  --accent:#3f8a74; --accent-fg:#ffffff; --ink:#2b3430; --ink-fg:#ffffff;
  --need:#5d89ab; --want:#d69c5c; --save:#6aa884; --free:#cad0cc;
  --bad:#c35f57; --ok:#4c9a6e; --res:#9a86c4; --debt:#c98a73;
  --h1:#10221c; --h2:#1f4a3d; --h3:#3f8a74; --h4:#8fcbb3;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1f2624; --soft:#252d2b; --fg:#dde3e0; --muted:#939e98; --line:#2f3835;
  --accent:#72bea0; --accent-fg:#14201b; --ink:#dde3e0; --ink-fg:#141917;
  --need:#80a8c8; --want:#dfae78; --save:#88c3a1; --free:#47514d; --bad:#dd8079; --ok:#7cc79c; --res:#b3a3dc; --debt:#dca08a;
  --h1:#0b1814; --h2:#163a30; --h3:#2f6f5d; --h4:#5f9f88; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1f2624; --soft:#252d2b; --fg:#dde3e0; --muted:#939e98; --line:#2f3835;
  --accent:#72bea0; --accent-fg:#14201b; --ink:#dde3e0; --ink-fg:#141917;
  --need:#80a8c8; --want:#dfae78; --save:#88c3a1; --free:#47514d; --bad:#dd8079; --ok:#7cc79c; --res:#b3a3dc; --debt:#dca08a;
  --h1:#0b1814; --h2:#163a30; --h3:#2f6f5d; --h4:#5f9f88; color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));min-height:100vh}
.ico{width:18px;height:18px;flex:none}

/* hero */
.hero{background:radial-gradient(120% 90% at 85% 0%,var(--h4) 0%,var(--h3) 32%,var(--h2) 64%,var(--h1) 100%);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 40px}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:12.5px;white-space:nowrap}
.hbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 13px;font-weight:500;font-size:13.5px}
.msw{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:2px}
.msw button{border:0;background:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1}
.msw b{font-weight:500;font-size:13.5px;min-width:104px;text-align:center}
.wm{font:700 18px var(--display);letter-spacing:-.02em;display:inline-flex;align-items:center}
.wm svg{width:.8em;height:.8em;margin:0 .03em;transform:translateY(.04em)}
.num{font:300 44px/1.05 var(--display);letter-spacing:-.03em;white-space:nowrap}
.num i{font-style:normal;opacity:.45}
.hl{font-size:14px;opacity:.82}
.hc{text-align:center;padding-top:22px}
.hc .num{margin:8px 0 12px}
.hseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(255,255,255,.14);border-radius:14px;padding:3px;font-size:13px;margin-top:12px}
.hseg button{border:0;background:none;color:#fff;padding:8px 0;border-radius:11px}
.hseg button[aria-pressed="true"]{background:#fff;color:#2b3430;font-weight:600}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:rgba(255,255,255,.12)}
.stack i{display:block;height:100%}
.hrow3{display:flex;justify-content:space-between;font-size:11.5px;opacity:.78;margin-top:6px;gap:6px}
.ringcard{margin-top:22px;border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center}
.ringcard svg{transform:rotate(-90deg)}
.lgr{display:flex;justify-content:space-between;font-size:12.5px;line-height:1.6;gap:8px}
.lgr span:last-child{white-space:nowrap;opacity:.85}

/* body sheet */
.body{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-26px;position:relative;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;min-height:50vh}
.card{background:var(--surface);border-radius:20px;padding:14px}
.card h4{margin:0 0 8px;font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h4 span{font-weight:400;color:var(--muted);font-size:12.5px;text-align:right}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts button{border:0;border-radius:18px;background:var(--surface);padding:12px 6px;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px}
.today{background:var(--ink);color:var(--ink-fg);border-radius:22px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.today small{display:block;opacity:.7;font-size:12px}
.today b{font:400 22px var(--display);letter-spacing:-.02em;white-space:nowrap}
.today>div:first-child{flex:none}
.today .rt{text-align:right;font-size:12.5px;opacity:.8}
.h{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:15px;padding:2px 4px 0}
.h button{border:0;background:none;color:var(--muted);font-weight:400;font-size:13px}
.op{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px}
.op .i{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.card .op .i{background:var(--soft)}
.op small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op b{font-weight:600;white-space:nowrap}
.op b.in{color:var(--ok)}
.day{font-size:12px;color:var(--muted);font-weight:600;margin:8px 4px 0}
.tagp{display:inline-block;font-size:10.5px;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px;font-weight:500;background:color-mix(in srgb,var(--res) 20%,transparent);color:var(--res)}
.tagp.me{background:color-mix(in srgb,var(--want) 22%,transparent);color:color-mix(in srgb,var(--want) 80%,var(--fg))}
.tagp.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
section{display:flex;flex-direction:column;gap:12px;padding:16px 14px}
.big{font:400 26px var(--display)}
.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--ink);color:var(--ink-fg);font-weight:600}
.btn.acc{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:8px 12px;font-size:13px}
.btn.w{width:100%}
.addc{border:1.5px dashed var(--line);background:none;border-radius:14px;padding:11px;text-align:center;color:var(--muted);font-size:13.5px;width:100%}

/* plan rows */
.gh{display:flex;align-items:center;gap:8px;margin:6px 4px 0;font-weight:600;font-size:14px}
.gh i{width:10px;height:10px;border-radius:50%}
.gh span{margin-left:auto;font-weight:500;color:var(--muted);font-size:12.5px;white-space:nowrap}
.sub{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:8px 4px 0}
.rows{background:var(--surface);border-radius:18px;padding:2px 12px}
.r{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.r:first-child{border-top:0}
.r b{font-weight:600;white-space:nowrap}
.r.ed b::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.8px solid var(--muted);border-top:1.8px solid var(--muted);transform:rotate(45deg);margin-left:9px;vertical-align:2px}
.r small{grid-column:1/3;color:var(--muted);font-size:11.5px;line-height:1.3}
.r small.over{color:var(--bad)}
.tr{grid-column:1/3;height:3px;border-radius:2px;background:var(--line);overflow:hidden}.tr i{display:block;height:100%;border-radius:2px}
.hintbox{font-size:12px;color:var(--muted);background:var(--surface);border-radius:14px;padding:9px 12px}

/* bubbles */
.bubs{position:relative;margin-top:12px}
.bub{position:absolute;border-radius:50%;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:11.5px;line-height:1.2;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.bub b{font:600 14px var(--body);margin-top:2px}
.bub span{max-width:86%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub svg.arc{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg);pointer-events:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini div{background:var(--surface);border-radius:18px;padding:12px}
.mini small{display:block;color:var(--muted);font-size:12px}
.mini b{font-weight:600;font-size:15px}

/* funds */
.fund{width:100%;border:0;text-align:left;background:var(--surface);border-radius:22px;padding:14px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center}
.ringwrap{position:relative;width:62px;height:62px}
.ringwrap svg{width:62px;height:62px;transform:rotate(-90deg)}
.ringwrap span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600}
.fund .t b{display:block;font-size:15px}
.fund .t em{display:block;font-style:normal;font:400 17px var(--display);letter-spacing:-.02em}
.fund .t small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.fund .t small.neg{color:var(--bad)}
.accs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.accs span{flex:1 0 auto;border-radius:16px;padding:9px 11px;font-size:11.5px;min-width:96px}
.accs span b{display:block;font:400 14px var(--display)}
.wf{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
.wf:first-of-type{border-top:0}
.wf b{font-weight:600;white-space:nowrap}
.ym{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.ym:first-of-type{border-top:0}
.ym small{display:block;color:var(--muted);font-size:11.5px}
.ym b{white-space:nowrap;font-weight:600}
.ym.hot b{color:var(--bad)}
.gf{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gf:first-of-type{border-top:0}
.gf .dd{width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 14px/1 var(--body)}
.gf .dd small{font-size:9.5px;font-weight:500;color:var(--muted);margin-top:3px;text-transform:uppercase}
.gf small{display:block;color:var(--muted);font-size:11.5px}
.gf b{white-space:nowrap}

/* charts */
.mb{width:100%;border:0;background:none;display:grid;grid-template-columns:32px minmax(0,1fr) 66px;gap:8px;align-items:center;font-size:12px;padding:3px 2px;border-radius:8px;text-align:left}
.mb .bb{height:12px;border-radius:4px;display:flex;overflow:hidden;gap:1px;background:var(--soft)}
.mb .bb i{display:block;height:100%}
.mb b{text-align:right;font-weight:600}
.mb.on{background:var(--soft)}
.mb.top b{color:var(--bad)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.y5{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:7px 0}
.y5 .bb{height:14px;border-radius:5px;display:flex;overflow:hidden;gap:1px;background:var(--soft)}
.y5 .bb i{display:block}
.y5 span:last-child{text-align:right;white-space:nowrap}.y5 small{display:block;color:var(--muted);font-size:11px}
.fact{font:300 19px/1.35 var(--display);letter-spacing:-.01em;margin:10px 0 14px;min-height:76px;text-wrap:balance}
.fact b{font-weight:600}
.dots{display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:#fff}
.rk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0}.rk .no{font:400 13px var(--display);color:var(--muted)}.rk small{display:block;color:var(--muted);font-size:11.5px}.rk b{white-space:nowrap}
.fq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;padding:6px 0}.fq small{color:var(--muted);font-size:11.5px}.fq .cnt{font:400 13px var(--display)}
.fq .fb{grid-column:1/3;height:5px;border-radius:3px;background:var(--soft)}.fq .fb i{display:block;height:100%;border-radius:3px}

/* add */
.addv{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;display:flex;flex-direction:column;gap:10px}
.bk{border:0;background:var(--surface);border-radius:999px;padding:7px 14px 7px 11px;font-weight:500;font-size:13.5px;align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on,.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chip.mic{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.days{display:flex;justify-content:center;gap:4px;font-size:11px;color:var(--muted);text-align:center}
.days button{width:44px;padding:6px 0;border-radius:12px;border:0;background:none;color:var(--muted)}
.days button b{display:block;font-size:15px;color:var(--fg);font-weight:600}
.days button.on{background:var(--ink);color:var(--ink-fg)}.days button.on b{color:var(--ink-fg)}
.days label{width:44px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--muted)}
.days label input{position:absolute;inset:0;opacity:0;padding:0}
.amount{text-align:center;font:300 48px/1 var(--display);letter-spacing:-.03em;margin:4px 0}
.amount i{font-style:normal;color:var(--muted)}
.heard{text-align:center;font-size:12.5px;color:var(--muted);min-height:16px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px;padding:4px 18px 0;max-width:360px;margin:0 auto;width:100%}
.keys button{height:58px;width:58px;border-radius:50%;border:0;background:var(--surface);font-size:21px;justify-self:center}
.keys button.go{background:var(--ink);color:var(--ink-fg)}
.sayin{width:100%;border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.fl{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent);padding:0}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;border:0;background:none;width:100%;text-align:left;padding:4px 0}
.sw small{display:block;color:var(--muted);font-size:11.5px}
.sw i{width:46px;height:28px;border-radius:999px;background:var(--free);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked="true"] i{background:var(--accent)}.sw[aria-checked="true"] i::after{left:21px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:14px;padding:3px;font-size:12.5px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:11px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.step{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:10px;align-items:center}
.step button{height:48px;border-radius:16px;border:0;background:var(--soft);font-size:22px}
.step input{text-align:center;font:300 28px var(--display);letter-spacing:-.02em;border:0;background:none;padding:4px}
.del{border:0;background:none;color:var(--bad);font-size:14px;padding:8px 0}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.pull{background:var(--surface);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px;flex:none}
.pull .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pull .ttl b{font-size:17px}
.pull .ttl small{color:var(--muted);font-size:12.5px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:#2b3430;border-radius:24px;padding:6px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
nav.tabs button{height:50px;border:0;background:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#a9b4ae;font-size:10.5px;line-height:1}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{background:#fff;color:#2b3430}
nav.tabs button.add svg{width:26px;height:26px;padding:4px;border-radius:50%;background:#3f8a74;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#2b3430;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
 .toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
 .pull{animation:sl .22s ease-out}@keyframes sl{from{transform:translateY(40px);opacity:.4}}
 .tr i,.stack i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}}
}

/* old form parts reused in sheets */
.payrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:6px}
.payrow input{padding:8px;font-size:14px}
.payrow .del{color:var(--muted);font-size:18px;padding:4px}
.hint{font-size:13px;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:12px;padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.grp-h h3{margin:0;font-size:16px}
.pull .sub,.card .sub{text-transform:none;letter-spacing:0;font-size:13px;margin:0}

.rows .r[data-fund] b::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.8px solid var(--muted);border-top:1.8px solid var(--muted);transform:rotate(45deg);margin-left:9px;vertical-align:2px}

/* Взнос = постоянная часть S + догоняющая C до месяца end, чтобы к каждому платежу хватало */
function fundSched(f){

function packBubbles(items,W,H){const mx=Math.max(...items.map(x=>x.f)),R=Math.min(W,H)*.2,out=[];
  const sorted=[...items].sort((a,b)=>b.f-a.f);
  for(const it of sorted){const r=Math.max(30,Math.sqrt(it.f/mx)*R);let best=null;
    for(let k=0;k<1400&&!best;k++){const a=k*.35,d=k*.9,x=W/2+Math.cos(a)*d,y=H/2+Math.sin(a)*d*.9;

function parseSay(t){const low=t.toLowerCase().replace(/(\d)[\s ]+(?=\d{3}\b)/g,"$1");let n=(low.match(/\d+/)||[])[0];n=n?Number(n):0;

function viewFundsN(){

  const acc={};for(const f of list)acc[f.p||"Без счёта"]=(acc[f.p||"Без счёта"]||0)+fundKzt(f);

function contribSheet(f){if(!f)return;
  const p=JSON.parse(JSON.stringify(fundPlan(f)||{mode:"fixed",g:fundLayer(f)})),debt=fundLayer(f)==="debt",cur0=fundMonthly(f),val=fundValue(f);
  if(p.mode==="gifts"||p.mode==="schedule"){openSheet(`<div class="ttl"><b>${esc(f.n)}</b><small>${n0(cur0)} в месяц</small></div><div class="note">Взнос считается сам — из ${p.mode==="gifts"?"списка подарков":"списка поездок и платежей"}, чтобы к каждой дате хватало. Поменяй список — взнос пересчитается.</div><button class="btn w" id="cOpen">Открыть копилку</button>`,s=>{s.querySelector("#cOpen").onclick=()=>{closeSheet();sub="fund:"+f.id;fdMode="y";render();window.scrollTo(0,0)}});return}

  const calc=x=>{if(p.mode!=="target"||!p.t)return"";if(!x)return"При нуле цель не будет достигнута";const n=Math.ceil(left/x);const e=shift(s0,Math.max(0,n-1));return left?`${debt?"Закроешь":"Наберёшь"} ${n0(p.t)} — срок: ${MONTH_NAMES[Number(e.slice(5))-1].toLowerCase()} ${e.slice(0,4)}`:"Цель уже набрана"};

   <div class="step"><button data-cs="-1" aria-label="Меньше">−</button><input id="cV" inputmode="numeric" value="${n0(cur0)}" aria-label="Сумма в месяц"><button data-cs="1" aria-label="Больше">+</button></div>
   <div class="note" id="cN">${p.mode==="target"&&p.t?(debt?"Осталось отдать ":"Осталось набрать ")+n0(left)+" · "+calc(cur0):"Будет откладываться каждый месяц"}</div>

    sh.querySelector("#cOk").onclick=async()=>{const x=parseNum(iv.value);
      if(p.mode==="target"&&p.t){if(!x){toast("Взнос не может быть нулём при цели");return}p.s=s0;p.h=val;p.x=x;p.b=left?shift(s0,Math.max(0,Math.ceil(left/x)-1)):s0}

     ${ev.map(e=>`<div class="wf"><span>${esc(e.n||W)}</span><b>−${n0(e.a)}</b></div>`).join("")}${outs.map(o=>`<div class="wf"><span>${esc(o.n)} · ${dShort(o.d)}</span><b>−${n0(o.a)}</b></div>`).join("")}
     ${planIn>factIn?`<button class="btn acc w" style="margin-top:10px" data-act="putin" data-k="${k}">Записать взнос · ${n0(planIn-factIn)}</button>`:""}</div>

  return`<div class="hero"><div class="top">${back("funds","Копилки")}<button class="hbtn" data-act="tripNew">+ ${W}</button></div>
   <div class="hl" style="margin-top:12px">Копилка «${esc(f.n)}»${p.own?" · личная, "+esc(p.own):""}</div>

   <div class="hseg"><button data-fd="m" aria-pressed="${fdMode==="m"}">${MONTH_NAMES[mi]}</button><button data-fd="y" aria-pressed="${fdMode==="y"}">${trip?"Все поездки":"Все платежи"}</button></div></div>
   <div class="body">${b}<button class="addc" data-act="fEdit">Другие настройки копилки</button></div>`;
}
async function saveTripPlan(f,mut){
  const p=JSON.parse(JSON.stringify(fundPlan(f)||{g:"res"}));
  if(p.mode!=="schedule"){p.mode="schedule";p.pay=[];p.s=p.s&&p.s>=nowYm()?p.s:shift(nowYm(),1);p.rep=false}
  p.pay??=[];mut(p);p.pay=p.pay.filter(r=>r.ym&&r.a);p.h=fundValue(f);

  catch(e){haptic("error");toast("Не сохранилось. Проверьте интернет.")}}

    if(act==="fEdit"){const f=fundById(sub.slice(5));fEdit={...f,plan:JSON.parse(JSON.stringify(fundPlan(f)||{mode:"fixed",s:shift(nowYm(),1),x:0,h:0,g:"save"}))};fEdit.plan.pay??=[];if(!["res","debt","save"].includes(fEdit.plan.g))fEdit.plan.g=fundLayer(f);sub="fedit";render();window.scrollTo(0,0);return}
    if(act==="fCancel"){goBack();return}
    if(act==="gNew"){giftSheet({id:"",n:"",o:"",d:null,m:Number(cur.slice(5)),a:0,r:"year",f:false,c:""});return}
    if(act==="putin"){a.disabled=true;const k=a.dataset.k,s=sums(cur),r=(s.P[k]||0)-(s.byCat[k]||0);
      try{const o=await api("addOp",putInOp(k,r));ensure(o.d.slice(0,7)).ops.push(o);haptic("success");toast(`Записано ${n0(r)} ₸`);rerenderKeepScroll()}catch(x){haptic("error");toast("Не сохранилось. Проверьте интернет.");a.disabled=false}return}
    if(act==="more"){moreSheet();return}
    if(act==="howLeft"){const s=sums(cur),ob=s.plan.need+s.plan.debt,obF=s.fact.need+s.fact.debt;
      openSheet(`<div class="ttl"><b>Как считается</b></div>
       <div class="card" style="background:var(--soft)"><h4>Жизнь<span>вместе и личное</span></h4><div class="wf"><span>Заложено на месяц</span><b>${n0(s.plan.want)}</b></div><div class="wf"><span>Уже потрачено</span><b>−${n0(s.fact.want)}</b></div><div class="wf"><span>Осталось</span><b>${n0(s.plan.want-s.fact.want)}</b></div></div>
       <div class="card" style="background:var(--soft)"><h4>Не входит сюда</h4><div class="wf"><span>Обязательства и долги</span><b>${n0(obF)} из ${n0(ob)}</b></div><div class="wf"><span>Резервы и копилки</span><b>${n0(s.putF)} из ${n0(s.putP)}</b></div></div>
       <div class="note">Квартира, коммуналка, налоги, помощь родителям и долги — обязательные платежи, их видно в «Плане».</div>`);return}
    if(act==="tripNew"){tripSheet(fundById(sub.slice(5)));return}
    if(act==="say"){sayOpen=true;render();return}
  }
  const op=t.closest("[data-op]");if(op){opSheet(op.dataset.op);return}
  const tb=t.closest("nav.tabs button");if(tb){const nt=tb.dataset.tab;if(nt==="add"&&tab!=="add")prevTab=tab;if(nt==="plan")planMode="M";go(nt);return}
  const pm=t.closest("[data-pm]");if(pm){planMode=pm.dataset.pm;oSel=-1;render();return}
  const om=t.closest("[data-om]");if(om){const i=Number(om.dataset.om);oSel=oSel===i?-1:i;rerenderKeepScroll();return}
  const pr=t.closest("[data-pr]");if(pr){editSheet("cat",pr.dataset.pr);return}
  const inc=t.closest("[data-inc]");if(inc){editSheet("inc",Number(inc.dataset.inc));return}
  const fr=t.closest(".rows [data-fund]");if(fr){contribSheet(fundById(fr.dataset.fund));return}
  const fd=t.closest("[data-fund]");if(fd){sub="fund:"+fd.dataset.fund;fdMode="m";gMode="m";render();window.scrollTo(0,0);return}
  const fdm=t.closest("[data-fd]");if(fdm){fdMode=fdm.dataset.fd;rerenderKeepScroll();return}
  const gm=t.closest("[data-gm]");if(gm){gMode=gm.dataset.gm;rerenderKeepScroll();return}
  const stm=t.closest("[data-stm]");if(stm){stMode=stm.dataset.stm;render();return}
  const tp=t.closest("[data-trip]");if(tp){const f=fundById(sub.slice(5));tripSheet(f,Number(tp.dataset.trip));return}
  if(t.closest("#trRep")){const f=fundById(sub.slice(5));saveTripPlan(f,p2=>{p2.rep=!p2.rep});return}
  const gr=t.closest("[data-g]");if(gr&&gifts){const g=gifts.find(x=>x.id===gr.dataset.g);if(g)giftSheet({...g});return}
  const bub=t.closest("[data-cat]");if(bub){catSheet(bub.dataset.cat);return}
  if(tab!=="add")return;
  const md=t.closest("[data-mode]");if(md){const m=md.dataset.mode;if(m==="in"){draft.c="";draft.s="";draft.n=""}else if(m==="out"){draft.s="out";if(isFundKey(draft.c))draft.c=""}else{draft.s="";draft.f="";if(isFundKey(draft.c))draft.c=""}
    if(m==="in"){draft.c="fund:"+(funds[0]?.id||"")}render();return}
  const dy=t.closest("[data-day]");if(dy){draft.d=dy.dataset.day;render();return}
  const nm=t.closest("[data-name]");if(nm){draft.n=nm.dataset.name;draft.c=nm.dataset.c;if(draft.s!=="out"){const fdd=fundFor(draft.c);if(fdd&&fundValue(fdd)>0){draft.s="out";draft.f=fdd.id}}render();return}
  const fi=t.closest("[data-fin]");if(fi){draft.c="fund:"+fi.dataset.fin;draft.n="";render();return}
  const fo=t.closest("[data-fout]");if(fo){draft.f=fo.dataset.fout;render();return}
  const k=t.closest("[data-k]");if(k){const key=k.dataset.k;if(key==="✓"){saveDraft();return}
    let s=String(draft.a||"");s=key==="⌫"?s.slice(0,-1):(s.length<10?s+key:s);draft.a=Number(s)||"";
    const el=document.getElementById("amt");if(el)el.innerHTML=(draft.a?n0(draft.a):"0")+"<i> ₸</i>";return}
});

/* Сохранение плана по очереди: быстрые правки подряд не перетирают друг друга.
   Экран меняется сразу; на сервер правки уходят строго одна за другой, каждая — с уже учтёнными предыдущими. */
let saveQ=Promise.resolve(),pendingSaves=0;
function applyChange(ch){
  const k=cur,t=T(),scope=t?pScope:"only",out={};
  const mod=(cats,inc)=>{if(ch.kind==="cat"){if(ch.v)cats[ch.c]=ch.v;else delete cats[ch.c]}
    else if(ch.kind==="inc")inc[ch.i]={n:ch.n,a:ch.a};else if(ch.kind==="incAdd")inc.push({n:"Новый доход",a:0});else if(ch.kind==="incDel")inc.splice(ch.i,1)};
  if(scope==="only"){const cats=planCats(k),inc=planInc(k);mod(cats,inc);out[k]={plan:cats,incomes:inc}}
  else{if(ch.kind==="cat")mod(t.cats,[]);else{const inc=planInc(k);mod({},inc);t.inc=inc}if(k<t.from)t.from=k;
    for(const k2 of Object.keys(months).filter(x=>x>=k&&hasOwn(x))){const cats=planCats(k2);let inc=planInc(k2);if(ch.kind==="cat")mod(cats,inc);else inc=t.inc.map(i=>({...i}));out[k2]={plan:cats,incomes:inc}}}
  for(const[k2,v]of Object.entries(out)){const m=ensure(k2);m.plan=v.plan;m.incomes=v.incomes.map((i,x)=>({id:"tmp"+x,...i}))}
  rerenderKeepScroll();
  const tSnap=scope==="all"&&t?JSON.parse(JSON.stringify(t)):null,oSnap=JSON.parse(JSON.stringify(out));
  pendingSaves++;
  saveQ=saveQ.then(async()=>{
    try{if(tSnap)await api("setYear",{year:"template",data:tSnap});
      let d=null;if(Object.keys(oSnap).length)d=await api("applyYear",{months:oSnap});
      pendingSaves--;
      if(!pendingSaves){if(d)ingest(d,true);rerenderKeepScroll();toast(scope==="all"?"Сохранено на сервере ✓ — и в следующих месяцах":"Сохранено на сервере ✓ — только в этом месяце")}}
    catch(e){pendingSaves--;haptic("error");toast(e.message==="unknown_action"?"Не сохранилось: на сервере старый код.":"Не сохранилось, проверьте интернет. ("+(e.message||"ошибка")+")");if(!pendingSaves)await load(true)}});
  return saveQ;
}

/* Депозитный процент: в начале каждого следующего месяца к остатку прибавляется доход
   (ставка / 12 от остатка на конец прошлого месяца). Для долгов не считается. */
const fundRate=f=>fundLayer(f)==="debt"?0:Math.max(0,Number(String(f.rate||"").replace(",","."))||0)/100/12;
function fundCalc(f){
  let v=f.bal!=null?f.bal:(f.start||0),earned=0;const r=fundRate(f),ops=[];
  for(const o of allOps()){if(f.bal!=null&&f.bd&&o.d<=f.bd)continue;const k=opIntoFund(o,f);if(k)ops.push({d:o.d,a:k*o.a})}
  ops.sort((a,b)=>a.d.localeCompare(b.d));
  if(!r)return{v:v+ops.reduce((s,o)=>s+o.a,0),earned:0};
  const now=nowYm();let k=(f.bal!=null&&f.bd?f.bd:(ops[0]?.d||todayStr())).slice(0,7),i=0;
  while(true){while(i<ops.length&&ops[i].d.slice(0,7)<=k){v+=ops[i].a;i++}if(k>=now)break;
    k=shift(k,1);const add=Math.max(0,v)*r;v+=add;earned+=add}
  while(i<ops.length){v+=ops[i].a;i++}
  return{v:Math.round(v),earned:Math.round(earned)}}
function fundValue(f){return fundCalc(f).v}
function fundProject(f,K){let v=fundValue(f);const r=fundRate(f),from=shift(nowYm(),1),s0=fundPlan(f)?.s||from;if(K<from)return v;
  const ev=fundEvents(f,from>s0?from:s0,K);for(let k=from;k<=K;k=shift(k,1)){v+=Math.max(0,v)*r;v+=fundAt(f,k);v-=ev.filter(e=>e.ym===k).reduce((a,e)=>a+e.a,0)}return Math.round(v)}


document.getElementById("view").innerHTML=loadingHtml();
load();
